<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        
    const add1 = function (a, b) {
        return a + b;
    };
    console.log("Add: ", add1(10, 9));

    const sub1 = function (a, b) {
        return a - b;
    };
    console.log("Sub: ", sub1(12, 5));

    const mul1 = function (a, b) {
        return a * b;
    };
    console.log("Mul: ", mul1(10, 7));

    const div1 = function (a, b) {
        return b !=0 ? a / b : 'Cannot divide by zero';
    };
    console.log("Div: ", div1(10, 6));

    const mod1 = function (a, b) {
        return b != 0 ? a % b : 'Cannot mod by zero';
    };
    console.log("Mod: ", mod1(10, 5));

    
    let pattern1 = '';
    for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
            pattern1 += '* ';
        }
        pattern1 += '\n';
    }
    console.log(pattern1);

    
    let pattern2 = '';
    for (let i = 1; i <= 3; i++) {
        for (let j = 1; j <= i; j++) {
            pattern2 += '* ';
        }
        pattern2 += '\n';
    }
    console.log(pattern2);

    
    let rows = 3;
    let pattern3 = '';

    for (let i = 1; i <= rows; i++) {
        for (let j = i; j < rows; j++) {
            pattern3 += ' ';
        }
        for (let k = 1; k <= (2 * i - 1); k++) {
            pattern3 += '*';
        }
        pattern3 += '\n';
    }
    console.log(pattern3); 
    let pattern4 = '';
    for (let i = 3; i >= 1; i--) {
        for (let j = 1; j <= i; j++) {
            pattern4 += '*';
        }
        pattern4 += '\n';
    }
    console.log(pattern4);
    
   
    </script>
</head>
<body>
    
</body>
</html>
