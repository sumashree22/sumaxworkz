<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplication form</title>
</head>
<body>
    <div>
      <form >
        <div>
            <label for="idName">Name</label>
            <span style="color: red;">*</span>
            <span>:</span>
            <input type="text" id="idName" placeholder="Enter your name" required><div>

            </div>
           <label for="idEmail">EmailId</label>
           <span style="color: red;">*</span>
           <span>:</span>
           <input type="email" id="idEmail" required>
          </div>
        <div>
            <label for="idPhone">Phone number</label>
            <span style="color: red;">*</span>
            <span>:</span>
            <input type="number" id="idPhone" required>
        </div>
        <div>
            <label for="idPassword">idPassword</label>
            <span style="color: red;">*</span>
            <span>:</span>
            <input type="password" id="idPassword" required>
        </div>
        <div>
            <label for="confirm">confirm password</label>
            <span style="color: red;">*</span>
            <span>:</span>
            <input type="password" id="confirm" required>
        </div>
        <div>
           
            <input type="checkbox" id="python">
            <label for="python">java</label>
        </div>
        <div>
            
            <input type="checkbox" id="java">
            <label for="java">python</label>
        </div>
        <div>
            
            <input type="checkbox" id="HTML">
            <label for="HTML">HTML</label>
        </div>
        <div>
            
            <input type="checkbox" id="CSS">
            <label for="CSS">CSS</label>
        </div>
      </form>
    </div>
    
</body>
</html>
